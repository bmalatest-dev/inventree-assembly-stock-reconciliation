[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "inventree-assembly-stock-reconciliation"
version = "0.4.0"
description = "InvenTree plugin for reconciling stock returned after external assembly"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Per Vices Corporation"}]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
  "Framework :: InvenTree",
]

[project.entry-points.inventree_plugins]
AssemblyStockReconciliationPlugin = "assembly_stock_reconciliation.plugin:AssemblyStockReconciliationPlugin"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["assembly_stock_reconciliation*"]

[tool.setuptools.package-data]
assembly_stock_reconciliation = ["static/*.js", "static/*.css"]
